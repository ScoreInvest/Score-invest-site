<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar — ScoreInvest</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">

</head>

<body id="body-cadastro-login">

    <div>
        <div class="card-cadastro-login">
            <a href="index.html">
                <i class="fa-solid fa-arrow-left" style="font-size:22px ;"></i>
            </a>
            <h1>Entrar</h1>
            <p class="sub">Acesse o seu perfil para impulsionar sua empresa</p>

            <form>
                <div class="field">
                    <label for="email">E-mail</label>
                    <input type="email" id="ipt_email" placeholder="voce@empresa.com" required>
                </div>
                <div class="field">
                    <label for="senha">Senha</label>
                    <input type="password" id="ipt_senha" placeholder="••••••••" required>
                </div>
                <button type="button" class="btn-primary-cadastro-login"  onclick="logar()"> Entrar </button>
            </form>
            <div class="switch">
                Não tem conta? <a href="cadastro.html">Cadastrar-se</a>
            </div>
        </div>
    </div>

    <script>
    function logar() {
        let email = ipt_email.value;
        let senha = ipt_senha.value;

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: email,
                senhaServer: senha
            })
        })
        .then(function (resposta) {
            if (resposta.ok) {
                return resposta.json();
            } else {
                throw new Error("E-mail ou senha inválidos");
            }
        })
        .then(function (dados) {

            localStorage.setItem("ID_USUARIO", dados.id);
            localStorage.setItem("NOME_USUARIO", dados.nome);
            localStorage.setItem("EMAIL_USUARIO", dados.email);
            localStorage.setItem("EMPRESA_ID", dados.empresaId);
            localStorage.setItem("ROLE_USUARIO", dados.role);

            window.location.href = "index.html";
        })
        .catch(function (erro) {
            console.log(erro);
            alert("E-mail ou senha inválidos");
        });
    }
</script>
</body>

</html>
