<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta — ScoreInvest</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">

</head>

<body id="body-cadastro-login">

    <div>
        <div class="card-cadastro-login">
            <a href="index.html">
                <i class="fa-solid fa-arrow-left" style="font-size:22px ;"></i>
            </a>
            <h1>Criar conta</h1>
            <p class="sub">Comece a organizar os dados financeiros da sua empresa</p>

            <form>
                <div class="field">
                    <label for="nome">Nome da empresa</label>
                    <input type="text" id="nome" placeholder="Sua empresa" required>
                </div>
                <div class="field">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="voce@empresa.com" required>
                </div>
                <div class="field">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="••••••••" required>
                </div>
                <div class="field">
                    <label for="confirmar">Confirmar senha</label>
                    <input type="password" id="confirmar" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-primary-cadastro-login"> Cadastrar-se</button>
            </form>
            <div class="switch">
                Já tem conta? <a href="login.html">Entrar</a>
            </div>
        </div>
    </div>

</body>

</html>
